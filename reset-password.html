<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - WorkoutSocial</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f0f23 100%);
            min-height: 100vh;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            text-align: center;
            padding: 48px 24px;
            max-width: 480px;
        }
        
        .icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #E07A4D, #C86A3F);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 40px;
        }
        
        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 16px;
        }
        
        p {
            color: #9ca3af;
            margin-bottom: 24px;
            line-height: 1.6;
        }
        
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #E07A4D, #C86A3F);
            color: white;
            padding: 16px 32px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 24px rgba(224, 122, 77, 0.4);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(224, 122, 77, 0.5);
        }
        
        .instructions {
            margin-top: 32px;
            padding: 24px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            text-align: left;
        }
        
        .instructions h3 {
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 12px;
        }
        
        .instructions ol {
            color: #9ca3af;
            font-size: 14px;
            padding-left: 20px;
        }
        
        .instructions li {
            margin-bottom: 8px;
        }
        
        .loading {
            display: none;
            margin-top: 24px;
        }
        
        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(224, 122, 77, 0.3);
            border-top-color: #E07A4D;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .error-box {
            display: none;
            margin-top: 24px;
            padding: 16px;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            color: #EF4444;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🔐</div>
        <h1>Reset Your Password</h1>
        <p id="status-text">Choose a new password for your WorkoutSocial account.</p>

        <!-- Reset happens RIGHT HERE in the browser — works on any device, no app
             version required. (The old page only deep-linked into the iOS app, which
             stranded Android users — same bug verify-email.html had.) -->
        <form id="reset-form" style="text-align:left;">
            <input type="password" id="new-password" placeholder="New password (8+ chars, mix of Aa + number)"
                   autocomplete="new-password" minlength="8" required
                   style="width:100%; padding:14px 16px; margin-bottom:12px; border-radius:12px;
                          border:1px solid rgba(255,255,255,0.15); background:rgba(255,255,255,0.06);
                          color:#fff; font-size:16px; font-family:inherit;">
            <input type="password" id="confirm-password" placeholder="Confirm new password"
                   autocomplete="new-password" minlength="8" required
                   style="width:100%; padding:14px 16px; margin-bottom:20px; border-radius:12px;
                          border:1px solid rgba(255,255,255,0.15); background:rgba(255,255,255,0.06);
                          color:#fff; font-size:16px; font-family:inherit;">
            <button type="submit" id="submit-btn" class="btn"
                    style="width:100%; border:none; cursor:pointer; font-family:inherit;">
                Update password
            </button>
        </form>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="margin-top: 12px; font-size: 14px;">Updating your password...</p>
        </div>

        <div class="error-box" id="error-box"></div>

        <div id="success-box" style="display:none; margin-top:24px; padding:20px;
             background:rgba(34,197,94,0.1); border:1px solid rgba(34,197,94,0.3);
             border-radius:12px; color:#22C55E; font-size:15px; line-height:1.5;">
            ✅ <strong>Password updated!</strong><br>
            Open the WorkoutSocial app and log in with your new password.
        </div>
    </div>

    <script>
        const API_BASE = 'https://api.workoutsocial.app';
        const token = new URLSearchParams(window.location.search).get('token');

        const form = document.getElementById('reset-form');
        const loading = document.getElementById('loading');
        const errorBox = document.getElementById('error-box');
        const successBox = document.getElementById('success-box');
        const statusText = document.getElementById('status-text');

        function showError(msg) {
            errorBox.innerHTML = msg;
            errorBox.style.display = 'block';
            loading.style.display = 'none';
        }

        if (!token) {
            form.style.display = 'none';
            statusText.style.display = 'none';
            showError('<strong>No reset token found.</strong> This link may have expired or is invalid. Request a new password reset from the app\'s log-in screen.');
        }

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            errorBox.style.display = 'none';
            const pw = document.getElementById('new-password').value;
            const confirm = document.getElementById('confirm-password').value;
            if (pw !== confirm) { showError('Those passwords don\'t match — try again.'); return; }

            form.style.display = 'none';
            loading.style.display = 'block';
            try {
                const res = await fetch(API_BASE + '/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: token, newPassword: pw }),
                });
                loading.style.display = 'none';
                if (res.ok) {
                    statusText.style.display = 'none';
                    successBox.style.display = 'block';
                } else {
                    let msg = 'That reset link may have expired — request a new one from the app\'s log-in screen.';
                    try { msg = (await res.json()).message || msg; } catch (_) {}
                    form.style.display = 'block';
                    showError(msg);
                }
            } catch (err) {
                loading.style.display = 'none';
                form.style.display = 'block';
                showError('Couldn\'t reach the server — check your connection and try again.');
            }
        });
    </script>
</body>
</html>
